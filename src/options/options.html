<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TagMyEmail - Configuración</title>
  <style>
    :root {
      --red: #ff6347;
      --blue: #232638;
      --soft-blue: #08c2e2;
      --pink: #d15892;
      --soft-pink: #f4d4de;
      --purple: #846daa;
      --soft-indigo: #8aaef4;
      --primary: var(--soft-blue);
      --bg: var(--blue);
      --card-bg: #2d314d;
      --text: #ffffff;
      --text-muted: #b0b5d1;
    }

    body {
      font-family: 'Outfit', 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .container {
      background: var(--card-bg);
      padding: 40px;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      width: 100%;
      max-width: 400px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
    }

    h1 {
      font-size: 24px;
      margin-bottom: 8px;
      background: linear-gradient(45deg, var(--soft-blue), var(--soft-indigo));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
      color: var(--text-muted);
    }

    input {
      width: 100%;
      padding: 12px 16px;
      background: #2a2a2a;
      border: 1px solid #3a3a3a;
      border-radius: 12px;
      color: white;
      font-size: 16px;
      box-sizing: border-box;
      transition: all 0.3s ease;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(0, 255, 163, 0.1);
    }

    button {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      border: none;
      border-radius: 12px;
      color: #000;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(0, 255, 163, 0.2);
      filter: brightness(1.1);
    }

    button:active {
      transform: translateY(0);
    }

    .status {
      margin-top: 15px;
      font-size: 13px;
      text-align: center;
      min-height: 20px;
      transition: opacity 0.3s;
    }

    .privacy-notice {
      margin-top: 30px;
      padding: 15px;
      background: rgba(8, 194, 226, 0.05);
      border-radius: 12px;
      font-size: 12px;
      color: var(--text-muted);
      border: 1px solid rgba(8, 194, 226, 0.1);
    }

    .email-list {
      margin-bottom: 20px;
    }

    .email-item {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }

    .remove-btn {
      background: var(--red);
      width: auto;
      padding: 8px 12px;
      margin: 0;
      color: white;
    }

    .logo {
      width: 64px;
      height: 64px;
      object-fit: contain;
      margin-bottom: 20px;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="../assets/icon128.png" alt="Logo" class="logo">
    <h1>TagMyEmail</h1>
    <p>Configura tus correos base. Se guardan localmente en tu navegador.</p>

    <div id="emailList" class="email-list">
      <!-- Emails will be added here -->
    </div>

    <div class="form-group">
      <label for="newEmail">Agregar nuevo correo</label>
      <div class="email-item">
        <input type="email" id="newEmail" placeholder="ejemplo@gmail.com">
        <button id="addEmail" style="width: auto; margin: 0; padding: 0 20px;">+</button>
      </div>
    </div>

    <div id="status" class="status"></div>

    <div class="privacy-notice">
      <div style="display: flex; align-items: flex-start; gap: 10px;">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="var(--soft-blue)" stroke-width="2" style="flex-shrink: 0; margin-top: 2px;"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <div>
          <strong>Tu privacidad es prioridad:</strong> Todo se guarda localmente en <code>chrome.storage.local</code>. No compartimos, enviamos ni sincronizamos tus datos con ningún servidor externo. El código es 100% abierto y auditable.
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="options.js"></script>
</body>
</html>
